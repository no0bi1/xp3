
name: Build UnitXP SP3 v89

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl unzip
          clang-cl --version
          lld-link --version
          make --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install xwin
        run: |
          cargo install xwin --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/xwin" --help

      - name: Download x86 Windows SDK
        run: |
          xwin --arch x86 --accept-license splat \
            --output ./xwinSDK \
            --preserve-ms-arch-notation

          test -f xwinSDK/crt/include/vcruntime.h
          test -f xwinSDK/sdk/include/ucrt/stdlib.h
          test -f xwinSDK/sdk/lib/ucrt/x86/ucrt.lib
          test -f xwinSDK/sdk/lib/um/x86/kernel32.lib
          test -f xwinSDK/crt/lib/x86/libcmt.lib

      - name: Prepare DirectX 9 headers
        run: |
          curl -fL \
            "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8" \
            -o /tmp/d3dx.nupkg

          mkdir -p /tmp/d3dx d3d9x_headers
          unzip -q /tmp/d3dx.nupkg -d /tmp/d3dx

          header=$(find /tmp/d3dx -name d3dx9.h -print -quit)
          if [ -z "$header" ]; then
            echo "d3dx9.h not found in package"
            exit 1
          fi

          cp "$(dirname "$header")"/* d3d9x_headers/

          test -f d3d9x_headers/d3dx9.h

      - name: Verify MinHook and source
        run: |
          test -f MinHook_134/include/MinHook.h
          test -f coffTimeDateStamp.cpp
          test -f Makefile
          echo "Required project files found."

      - name: Build 32-bit DLL
        run: |
          make clean
          make V=1

          test -s UnitXP_SP3.dll
          file UnitXP_SP3.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: UnitXP-SP3-v89-x86
          path: UnitXP_SP3.dll
          if-no-files-found: error
