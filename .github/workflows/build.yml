
name: Build UnitXP SP3 v89

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install LLVM and Make
        shell: pwsh
        run: |
          choco install llvm make -y --no-progress

          $clang = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          $linker = Get-Command lld-link.exe -ErrorAction SilentlyContinue

          if (-not $clang -or -not $linker) {
            $roots = @(
              "C:\Program Files\LLVM",
              "C:\Program Files (x86)\LLVM",
              "C:\tools\llvm",
              "C:\ProgramData\chocolatey\lib\llvm"
            )

            $clangFile = Get-ChildItem $roots -Filter clang-cl.exe `
              -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1

            $linkerFile = Get-ChildItem $roots -Filter lld-link.exe `
              -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $clangFile) {
              throw "Could not locate clang-cl.exe"
            }

            if (-not $linkerFile) {
              throw "Could not locate lld-link.exe"
            }

            $llvmBin = $clangFile.DirectoryName
            $env:Path = "$llvmBin;$env:Path"
            $llvmBin | Out-File $env:GITHUB_PATH -Append
          }

          clang-cl.exe --version
          lld-link.exe /?
          make --version

      - name: Prepare SDK dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath

          if (-not $vs) {
            throw "Visual Studio installation not found"
          }

          $vcRoot = Join-Path $vs "VC\Tools\MSVC"
          $vc = Get-ChildItem $vcRoot -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1

          if (-not $vc) {
            throw "MSVC toolchain not found"
          }

          $kitRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdkVersion = Get-ChildItem "$kitRoot\Include" -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name

          if (-not $sdkVersion) {
            throw "Windows SDK not found"
          }

          $sdkInc = "$kitRoot\Include\$sdkVersion"
          $sdkLib = "$kitRoot\Lib\$sdkVersion"
          $root = Join-Path $PWD "xwinSDK"

          $dirs = @(
            "$root\crt\include",
            "$root\crt\lib\x86",
            "$root\sdk\include\ucrt",
            "$root\sdk\include\um",
            "$root\sdk\include\shared",
            "$root\sdk\lib\ucrt\x86",
            "$root\sdk\lib\um\x86"
          )

          New-Item -ItemType Directory -Force $dirs | Out-Null

          Copy-Item "$($vc.FullName)\include\*" "$root\crt\include" -Recurse -Force
          Copy-Item "$($vc.FullName)\lib\x86\*" "$root\crt\lib\x86" -Recurse -Force

          Copy-Item "$sdkInc\ucrt\*" "$root\sdk\include\ucrt" -Recurse -Force
          Copy-Item "$sdkInc\um\*" "$root\sdk\include\um" -Recurse -Force
          Copy-Item "$sdkInc\shared\*" "$root\sdk\include\shared" -Recurse -Force

          Copy-Item "$sdkLib\ucrt\x86\*" "$root\sdk\lib\ucrt\x86" -Recurse -Force
          Copy-Item "$sdkLib\um\x86\*" "$root\sdk\lib\um\x86" -Recurse -Force

          if (-not (Test-Path "$root\crt\include\stdlib.h")) {
            throw "MSVC CRT headers were not copied correctly"
          }

          if (-not (Test-Path "$root\sdk\include\um\Windows.h")) {
            throw "Windows SDK headers were not copied correctly"
          }

      - name: Prepare DirectX headers
        shell: pwsh
        run: |
          $url = "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8"
          $package = "$env:RUNNER_TEMP\d3dx.nupkg"
          $destination = "$env:RUNNER_TEMP\d3dx"

          Invoke-WebRequest $url -OutFile $package
          Expand-Archive $package -DestinationPath $destination -Force

          $header = Get-ChildItem $destination -Filter d3dx9.h -Recurse |
            Select-Object -First 1

          if (-not $header) {
            throw "d3dx9.h was not found in the downloaded package"
          }

          New-Item -ItemType Directory -Force d3d9x_headers | Out-Null
          Copy-Item "$($header.DirectoryName)\*" d3d9x_headers -Recurse -Force

      - name: Verify Makefile
        shell: pwsh
        run: |
          if (-not (Test-Path Makefile)) {
            throw "Makefile not found at repository root"
          }

          $makefile = Get-Content Makefile -Raw

          if ($makefile.Contains("-flto=thin")) {
            throw "Remove -flto=thin from Makefile"
          }

          if ($makefile.Contains("/Fo:`$@")) {
            throw "Change /Fo:`$@ to /Fo`$@ in both compilation rules"
          }

          Write-Host "Makefile checks passed."

      - name: Build DLL
        shell: pwsh
        run: |
          make

          if (-not (Test-Path UnitXP_SP3.dll)) {
            throw "Build failed: UnitXP_SP3.dll was not produced"
          }

          Write-Host "DLL build completed."
          Get-Item UnitXP_SP3.dll | Format-List Name, Length, LastWriteTime

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: UnitXP-SP3-v89-build
          path: UnitXP_SP3.dll
          if-no-files-found: error
