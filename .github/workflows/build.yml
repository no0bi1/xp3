
name: Build UnitXP SP3 v89

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository and MinHook
        shell: bash
        run: |
          set -euxo pipefail

          echo "Commit:"
          git rev-parse HEAD

          echo "Repository root:"
          ls -la

          echo "MinHook headers and sources:"
          find . -type f \( \
            -iname 'MinHook.h' -o \
            -iname 'buffer.c' -o \
            -iname 'hde32.c' -o \
            -iname 'hook.c' -o \
            -iname 'trampoline.c' \
          \) -print

          test -f Makefile
          test -f coffTimeDateStamp.cpp

          if [ ! -f MinHook_134/include/MinHook.h ]; then
            echo "::error::MinHook.h is not at MinHook_134/include/MinHook.h."
            echo "The listing above shows where the file exists in this checkout."
            exit 1
          fi

      - name: Install Clang and LLVM
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            lld-18 \
            llvm-18 \
            make \
            curl \
            unzip

          test -x /usr/lib/llvm-18/bin/clang-cl
          test -x /usr/lib/llvm-18/bin/lld-link

          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

          /usr/lib/llvm-18/bin/clang-cl --version
          /usr/lib/llvm-18/bin/lld-link --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install xwin
        shell: bash
        run: |
          set -euxo pipefail

          cargo install xwin --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/xwin" --help

      - name: Download x86 Windows SDK
        shell: bash
        run: |
          set -euxo pipefail

          "$HOME/.cargo/bin/xwin" \
            --accept-license \
            --arch x86 \
            splat \
            --output ./xwinSDK

          test -f xwinSDK/crt/include/vcruntime.h
          test -f xwinSDK/sdk/include/ucrt/stdlib.h
          test -f xwinSDK/sdk/lib/ucrt/x86/ucrt.lib
          test -f xwinSDK/sdk/lib/um/x86/kernel32.lib
          test -f xwinSDK/crt/lib/x86/libcmt.lib

      - name: Download DirectX 9 headers
        shell: bash
        run: |
          set -euxo pipefail

          curl -fL \
            "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8" \
            -o /tmp/d3dx.nupkg

          mkdir -p /tmp/d3dx d3d9x_headers
          unzip -q /tmp/d3dx.nupkg -d /tmp/d3dx

          header="$(find /tmp/d3dx -name d3dx9.h -print -quit)"
          test -n "$header"

          cp "$(dirname "$header")"/* d3d9x_headers/
          test -f d3d9x_headers/d3dx9.h

      - name: Build DLL
        shell: bash
        run: |
          set -euxo pipefail

          make clean

          make V=1 \
            CXX=/usr/lib/llvm-18/bin/clang-cl \
            LD=/usr/lib/llvm-18/bin/lld-link

          test -s UnitXP_SP3.dll
          file UnitXP_SP3.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: UnitXP-SP3-v89-x86
          path: UnitXP_SP3.dll
          if-no-files-found: error
