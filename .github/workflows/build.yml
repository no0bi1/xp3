
name: Build UnitXP SP3 v89

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install and locate LLVM
        shell: pwsh
        run: |
          choco install llvm make -y --no-progress

          $roots = @(
            "C:\Program Files\LLVM\bin",
            "C:\Program Files (x86)\LLVM\bin",
            "C:\ProgramData\chocolatey\bin",
            "C:\ProgramData\chocolatey\lib\llvm\tools\LLVM\bin"
          )

          $clang = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          $linker = Get-Command lld-link.exe -ErrorAction SilentlyContinue

          if (-not $clang -or -not $linker) {
            foreach ($root in $roots) {
              if ((Test-Path "$root\clang-cl.exe") -and
                  (Test-Path "$root\lld-link.exe")) {
                $llvmBin = $root
                break
              }
            }

            if (-not $llvmBin) {
              throw "Could not locate clang-cl.exe and lld-link.exe"
            }

            "$llvmBin" | Out-File $env:GITHUB_PATH -Append
            $env:Path = "$llvmBin;$env:Path"
          }

          clang-cl.exe --version
          lld-link.exe /?
          make --version

      - name: Locate MSVC and Windows SDK
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }

          $vs = & $vswhere -latest -products '*' -property installationPath

          if (-not $vs) {
            throw "Visual Studio installation not found"
          }

          $vcRoot = Join-Path $vs "VC\Tools\MSVC"
          $vc = Get-ChildItem $vcRoot -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1

          if (-not $vc) {
            throw "MSVC toolchain not found"
          }

          $kitRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdkVersion = Get-ChildItem "$kitRoot\Include" -Directory |
            Where-Object {
              Test-Path "$kitRoot\Lib\$($_.Name)\ucrt\x86\ucrt.lib"
            } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name

          if (-not $sdkVersion) {
            throw "Windows SDK with x86 libraries not found"
          }

          $vars = @{
            MSVC_INCLUDE = "$($vc.FullName)\include"
            MSVC_LIB     = "$($vc.FullName)\lib\x86"
            SDK_UCRT_INC = "$kitRoot\Include\$sdkVersion\ucrt"
            SDK_UM_INC   = "$kitRoot\Include\$sdkVersion\um"
            SDK_SHARED_INC = "$kitRoot\Include\$sdkVersion\shared"
            SDK_UCRT_LIB = "$kitRoot\Lib\$sdkVersion\ucrt\x86"
            SDK_UM_LIB   = "$kitRoot\Lib\$sdkVersion\um\x86"
          }

          foreach ($name in $vars.Keys) {
            $path = $vars[$name]

            if (-not (Test-Path $path)) {
              throw "Required SDK path not found: $path"
            }

            "$name=$($path -replace '\\','/')" |
              Out-File $env:GITHUB_ENV -Append
          }

          if (-not (Test-Path "$($vc.FullName)\include\stdlib.h")) {
            throw "MSVC stdlib.h not found"
          }

          if (-not (Test-Path "$kitRoot\Include\$sdkVersion\um\Windows.h")) {
            throw "Windows.h not found"
          }

          Write-Host "Using MSVC version $($vc.Name)"
          Write-Host "Using Windows SDK $sdkVersion"

      - name: Prepare DirectX headers
        shell: pwsh
        run: |
          $url = "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8"
          $package = "$env:RUNNER_TEMP\d3dx.nupkg"
          $destination = "$env:RUNNER_TEMP\d3dx"

          Invoke-WebRequest $url -OutFile $package
          Expand-Archive $package -DestinationPath $destination -Force

          $header = Get-ChildItem $destination -Filter d3dx9.h -Recurse |
            Select-Object -First 1

          if (-not $header) {
            throw "d3dx9.h not found in the downloaded package"
          }

          New-Item -ItemType Directory -Force d3d9x_headers |
            Out-Null

          Copy-Item "$($header.DirectoryName)\*" `
            d3d9x_headers -Recurse -Force

          "D3DX_INCLUDES=$((Resolve-Path d3d9x_headers).Path -replace '\\','/')" |
            Out-File $env:GITHUB_ENV -Append

      - name: Verify build configuration
        shell: pwsh
        run: |
          if (-not (Test-Path Makefile)) {
            throw "Makefile missing from repository root"
          }

          if (-not (Test-Path MinHook_134\include)) {
            throw "MinHook_134/include directory not found"
          }

          if (-not (Test-Path d3d9x_headers\d3dx9.h)) {
            throw "DirectX header is missing"
          }

          $makefile = Get-Content Makefile -Raw

          if ($makefile.Contains("-flto=thin")) {
            throw "Remove -flto=thin from Makefile"
          }

          if ($makefile.Contains("/Fo:`$@")) {
            throw "Fix /Fo`$@ in Makefile compilation rules"
          }

          Write-Host "Build configuration checks passed."

      - name: Build 32-bit DLL
        shell: pwsh
        run: |
          make

          if (-not (Test-Path UnitXP_SP3.dll)) {
            throw "Build failed: UnitXP_SP3.dll was not produced"
          }

          Get-Item UnitXP_SP3.dll |
            Format-List Name, Length, LastWriteTime

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: UnitXP-SP3-v89-build
          path: UnitXP_SP3.dll
          if-no-files-found: error
