
name: Build UnitXP SP3 v89

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install LLVM and build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            lld-18 \
            llvm-18 \
            make \
            curl \
            unzip \
            strace

          # Provide the MSVC-compatible compiler command expected by Makefile.
          sudo tee /usr/local/bin/clang-cl >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/clang-18 --driver-mode=cl "$@"
          EOF
          sudo chmod +x /usr/local/bin/clang-cl

          # Expose versioned LLVM linker tools under expected command names.
          for tool in lld-link llvm-lib; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              candidate="$(find /usr/bin -maxdepth 1 \
                -type f -name "${tool}-*" -print | sort -V | tail -n 1)"
              if [ -n "$candidate" ]; then
                sudo ln -sf "$candidate" "/usr/local/bin/$tool"
              fi
            fi
          done

          clang-cl --version
          lld-link --version
          make --version

      - name: Install Rust and xwin
        uses: dtolnay/rust-toolchain@stable

      - name: Download x86 Windows SDK
        shell: bash
        run: |
          set -euo pipefail

          rustup target add i686-pc-windows-msvc
          cargo install xwin --locked

          xwin --accept-license --arch x86 splat \
            --output ./xwinSDK

          test -f xwinSDK/crt/include/vcruntime.h
          test -f xwinSDK/sdk/include/ucrt/stdlib.h
          test -f xwinSDK/sdk/lib/ucrt/x86/ucrt.lib
          test -f xwinSDK/sdk/lib/um/x86/kernel32.lib
          test -f xwinSDK/crt/lib/x86/libcmt.lib

          echo "xwin SDK validation passed."

      - name: Download DirectX 9 headers
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8" \
            -o /tmp/d3dx.nupkg

          mkdir -p /tmp/d3dx d3d9x_headers
          unzip -q /tmp/d3dx.nupkg -d /tmp/d3dx

          header="$(find /tmp/d3dx -name d3dx9.h -print -quit)"
          if [ -z "$header" ]; then
            echo "ERROR: d3dx9.h was not found in the package."
            exit 1
          fi

          cp "$(dirname "$header")"/* d3d9x_headers/
          test -f d3d9x_headers/d3dx9.h

      - name: Validate repository files
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -f coffTimeDateStamp.cpp
          test -f MinHook_134/include/MinHook.h
          test -f d3d9x_headers/d3dx9.h

          echo "Repository dependencies found."

      - name: Build DLL
        shell: bash
        run: |
          set -euo pipefail

          make clean
          make

          test -s UnitXP_SP3.dll
          file UnitXP_SP3.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: UnitXP-SP3-v89-x86
          path: UnitXP_SP3.dll
          if-no-files-found: error
